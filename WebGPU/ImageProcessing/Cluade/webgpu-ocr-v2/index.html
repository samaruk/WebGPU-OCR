<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WebGPU OCR Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c10;--paper:#f0ede6;--lead:#1a1c23;
  --cyan:#00d4ff;--amber:#ffb300;--green:#00e676;
  --red:#ff3d57;--violet:#7c4dff;--border:#2a2d3a;
  --surface:#13151e;--surface2:#1d2030;
  --font-mono:'IBM Plex Mono',monospace;
  --font-display:'Unbounded',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--font-mono);min-height:100vh;overflow-x:hidden}

/* scanline overlay */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px)}

/* ── HEADER ── */
header{
  display:flex;align-items:center;gap:16px;
  padding:16px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(13,15,22,.95);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.logo{font-family:var(--font-display);font-size:15px;font-weight:900;letter-spacing:-.02em}
.logo span{color:var(--cyan)}
.pill{padding:3px 10px;border-radius:2px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid}
.pill-gpu{color:var(--cyan);border-color:var(--cyan);background:rgba(0,212,255,.06)}
.pill-onnx{color:var(--amber);border-color:var(--amber);background:rgba(255,179,0,.06)}
.pill-15{color:var(--green);border-color:var(--green);background:rgba(0,230,118,.06)}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* progress bar */
.progress-rail{height:2px;background:var(--border);position:relative}
#global-bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--amber));width:0%;transition:width .35s ease;box-shadow:0 0 12px var(--cyan)}

/* ── LAYOUT ── */
.shell{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 57px)}

/* ── SIDEBAR ── */
.sidebar{
  border-right:1px solid var(--border);
  background:var(--surface);
  padding:20px;
  display:flex;flex-direction:column;gap:18px;
  overflow-y:auto;
}
.sb-label{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#4a4f6a;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* upload */
#drop-zone{
  border:1.5px dashed var(--border);border-radius:6px;padding:28px 16px;text-align:center;cursor:pointer;
  background:var(--surface2);transition:all .2s;
}
#drop-zone:hover,#drop-zone.over{border-color:var(--cyan);background:rgba(0,212,255,.06)}
#drop-zone .icon{font-size:28px;display:block;margin-bottom:10px}
#drop-zone p{font-size:11px;color:#6a6f8a;line-height:1.7}
#drop-zone strong{color:var(--paper)}
#file-input{display:none}
#preview-img{width:100%;border-radius:4px;border:1px solid var(--border);display:block;margin-top:10px}
.img-meta{font-size:10px;color:#6a6f8a;margin-top:6px;display:flex;gap:12px}

/* run btn */
#run-btn{
  width:100%;padding:13px;border:none;border-radius:4px;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#fff;font-family:var(--font-display);font-weight:700;font-size:12px;
  letter-spacing:.06em;cursor:pointer;transition:opacity .2s,transform .1s;
}
#run-btn:hover{opacity:.88}
#run-btn:active{transform:scale(.98)}
#run-btn:disabled{opacity:.35;cursor:not-allowed}

/* stage list */
.stage-list{display:flex;flex-direction:column;gap:3px}
.si{
  display:flex;align-items:center;gap:9px;padding:7px 9px;
  border-radius:4px;font-size:10px;color:#6a6f8a;
  border:1px solid transparent;cursor:pointer;transition:all .15s;
}
.si:hover{background:var(--surface2);color:var(--paper)}
.si.running{color:var(--cyan);animation:blink .7s ease-in-out infinite alternate}
.si.done{color:var(--green)}
.si.error{color:var(--red)}
.si.active{background:rgba(0,212,255,.08);border-color:var(--cyan);color:var(--paper)}
@keyframes blink{from{opacity:.4}to{opacity:1}}
.si-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.si.done .si-dot{background:var(--green)}
.si.running .si-dot{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.si.error .si-dot{background:var(--red)}
.si-num{margin-left:auto;font-size:9px;color:#4a4f6a}

/* stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--surface2);border-radius:4px;padding:10px;border:1px solid var(--border)}
.stat .v{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--cyan)}
.stat .l{font-size:9px;color:#6a6f8a;margin-top:2px}

/* download btn */
#dl-btn{
  width:100%;padding:10px;background:transparent;
  border:1px solid var(--cyan);border-radius:4px;
  color:var(--cyan);font-family:var(--font-mono);font-size:10px;
  cursor:pointer;transition:all .2s;display:none;
}
#dl-btn:hover{background:rgba(0,212,255,.08)}

/* ── MAIN ── */
.main{padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:24px}

/* canvas grid */
.canvas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cv-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;overflow:hidden;transition:border-color .2s;
}
.cv-card.running{border-color:var(--cyan)}
.cv-card.done{border-color:rgba(0,230,118,.3)}
.cv-hdr{
  padding:10px 14px;background:var(--surface2);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
}
.cv-tag{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;background:rgba(0,212,255,.12);color:var(--cyan)}
.cv-name{font-family:var(--font-display);font-size:11px;font-weight:700}
.cv-ms{margin-left:auto;font-size:9px;color:#6a6f8a}
.cv-body{padding:12px}
.cv-body canvas{width:100%;border-radius:3px;background:#06070d;display:block;min-height:120px}
.cv-foot{margin-top:7px;font-size:9px;color:#6a6f8a;display:flex;gap:14px;flex-wrap:wrap}
.cv-foot .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--border);margin-right:4px;vertical-align:middle}
.cv-foot .dot.ok{background:var(--green)}

/* log */
.log-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.log-hdr{padding:9px 14px;background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6a6f8a;
  display:flex;align-items:center;gap:10px}
#log-out{height:150px;overflow-y:auto;padding:10px 14px;font-size:10px;line-height:1.9;color:#6a6f8a}
.ll{}.ll.info{color:var(--cyan)}.ll.ok{color:var(--green)}.ll.warn{color:var(--amber)}.ll.err{color:var(--red)}
.lt{color:#4a4f6a;margin-right:8px}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--cyan)}

@media(max-width:860px){.shell{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<header>
  <div class="logo">WebGPU<span>OCR</span></div>
  <span class="pill pill-gpu">WebGPU</span>
  <span class="pill pill-onnx">ONNX RT</span>
  <span class="pill pill-15">15 Stages</span>
  <div class="header-right">
    <span id="hdr-status" style="font-size:10px;color:#6a6f8a">Ready</span>
  </div>
</header>
<div class="progress-rail"><div id="global-bar"></div></div>

<div class="shell">
  <aside class="sidebar">
    <div>
      <p class="sb-label">Input Image</p>
      <div id="drop-zone">
        <span class="icon">⬡</span>
        <p><strong>Drop image here</strong><br>or click to browse<br><small>PNG · JPG · TIFF · BMP · WebP</small></p>
      </div>
      <input type="file" id="file-input" accept="image/*"/>
      <div id="preview-wrap" style="display:none">
        <img id="preview-img" alt="preview"/>
        <div class="img-meta"><span id="img-dims">–</span><span id="img-kb">–</span></div>
      </div>
    </div>

    <button id="run-btn" disabled>▶ RUN PIPELINE</button>

    <div>
      <p class="sb-label">Pipeline Stages</p>
      <div class="stage-list" id="stage-list"></div>
    </div>

    <div>
      <p class="sb-label">Performance</p>
      <div class="stats-grid">
        <div class="stat"><div class="v" id="s-total">—</div><div class="l">Total ms</div></div>
        <div class="stat"><div class="v" id="s-gpu">—</div><div class="l">GPU ms</div></div>
        <div class="stat"><div class="v" id="s-regions">—</div><div class="l">Regions</div></div>
        <div class="stat"><div class="v" id="s-chars">—</div><div class="l">Chars</div></div>
      </div>
    </div>

    <button id="dl-btn">⬇ Download All Stages (.zip)</button>
  </aside>

  <main class="main">
    <div class="canvas-grid" id="canvas-grid"></div>
    <div class="log-wrap">
      <div class="log-hdr">
        <span>Pipeline Log</span>
        <span id="log-count" style="margin-left:auto">0 entries</span>
      </div>
      <div id="log-out"></div>
    </div>
  </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
