<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice Engine · WebGPU</title>
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #111318;
      --border: #1e2330;
      --accent: #00e5ff;
      --accent2: #7c3aed;
      --text: #e8eaf0;
      --muted: #5a6070;
      --success: #00c896;
      --warn: #f59e0b;
      --error: #ef4444;
      --radius: 10px;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 18px;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    header span { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
    #gpu-badge {
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
      background: rgba(0,229,255,0.1); color: var(--accent);
      border: 1px solid rgba(0,229,255,0.25);
    }

    /* ── Layout ── */
    .workspace {
      display: grid;
      grid-template-columns: 340px 1fr 380px;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 61px);
    }

    /* ── Left Panel ── */
    .panel {
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--surface);
      overflow: hidden;
    }
    .panel-title {
      padding: 14px 18px 10px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    /* Upload Zone */
    #drop-zone {
      margin: 16px; border-radius: var(--radius);
      border: 2px dashed var(--border);
      padding: 28px 20px; text-align: center;
      cursor: pointer; transition: all 0.2s;
      background: rgba(255,255,255,0.02);
    }
    #drop-zone:hover, #drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(0,229,255,0.05);
    }
    #drop-zone .icon { font-size: 2.2rem; margin-bottom: 8px; }
    #drop-zone p { color: var(--muted); font-size: 0.82rem; line-height: 1.5; }
    #drop-zone strong { color: var(--text); }
    #file-input { display: none; }

    /* Config Sliders */
    .config-section { padding: 0 16px 12px; overflow-y: auto; flex: 1; }
    .cfg-group { margin-bottom: 18px; }
    .cfg-group label {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--muted); margin-bottom: 6px;
    }
    .cfg-group label span { color: var(--accent); font-family: var(--font-mono); }
    input[type=range] {
      width: 100%; accent-color: var(--accent);
      height: 4px; cursor: pointer;
    }

    /* Run Button */
    .run-btn {
      margin: 12px 16px;
      padding: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: var(--radius);
      color: #fff; font-size: 0.9rem; font-weight: 700;
      cursor: pointer; width: calc(100% - 32px);
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .run-btn:hover { opacity: 0.9; }
    .run-btn:active { transform: scale(0.98); }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Pipeline progress */
    #pipeline-log {
      padding: 0 16px 16px; overflow-y: auto;
      font-family: var(--font-mono); font-size: 0.72rem;
      flex: 1; max-height: 260px;
    }
    .log-entry {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
      opacity: 0.5; transition: opacity 0.3s;
    }
    .log-entry.active { opacity: 1; }
    .log-entry.done { opacity: 0.8; }
    .log-entry .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .log-entry.active .dot { background: var(--accent); animation: pulse 1s infinite; }
    .log-entry.done .dot { background: var(--success); }
    .log-entry.error .dot { background: var(--error); }
    .log-entry .ms { margin-left: auto; color: var(--accent); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Center Canvas ── */
    .canvas-area {
      position: relative; overflow: hidden;
      background: #070809;
      display: flex; align-items: center; justify-content: center;
    }
    #main-canvas {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    #overlay-canvas {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .view-tabs {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 2px;
      background: rgba(0,0,0,0.6); border-radius: 8px; padding: 3px;
      backdrop-filter: blur(8px); border: 1px solid var(--border);
    }
    .view-tab {
      padding: 5px 14px; border-radius: 6px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      color: var(--muted); background: none; border: none;
      transition: all 0.15s;
    }
    .view-tab.active { background: var(--accent); color: #000; }

    /* Stats bar */
    .stats-bar {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 18px;
      background: rgba(0,0,0,0.7); border-radius: 8px; padding: 8px 18px;
      backdrop-filter: blur(8px); border: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 0.72rem;
    }
    .stat { display: flex; gap: 6px; align-items: center; }
    .stat-label { color: var(--muted); }
    .stat-val { color: var(--accent); font-weight: 700; }

    /* ── Right Panel (JSON output) ── */
    .right-panel {
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      background: var(--surface); overflow: hidden;
    }
    .right-panel .panel-title {
      display: flex; align-items: center; justify-content: space-between;
    }
    .copy-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 3px 10px; border-radius: 6px;
      font-size: 0.7rem; cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }

    #json-output {
      flex: 1; overflow-y: auto; padding: 14px;
      font-family: var(--font-mono); font-size: 0.72rem;
      line-height: 1.7; white-space: pre;
      color: #a8b3c9;
    }
    .j-key { color: #7dd3fc; }
    .j-str { color: #86efac; }
    .j-num { color: #fca5a5; }
    .j-bool { color: #c4b5fd; }
    .j-null { color: var(--muted); }

    /* Table Preview */
    #table-preview {
      border-top: 1px solid var(--border);
      overflow-y: auto; max-height: 200px;
    }
    .inv-table {
      width: 100%; border-collapse: collapse;
      font-size: 0.72rem;
    }
    .inv-table th {
      background: rgba(0,229,255,0.08); color: var(--accent);
      padding: 7px 10px; text-align: left; font-weight: 600;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
    }
    .inv-table td {
      padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text);
    }
    .inv-table tr:hover td { background: rgba(255,255,255,0.03); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 10px 18px; border-radius: 8px;
      background: var(--success); color: #000;
      font-weight: 600; font-size: 0.82rem;
      transform: translateY(60px); opacity: 0;
      transition: all 0.3s; z-index: 999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }

    @media (max-width: 1100px) {
      .workspace { grid-template-columns: 300px 1fr; }
      .right-panel { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">⚡</div>
  <h1>Invoice Engine</h1>
  <span id="gpu-badge">WebGPU · WGSL</span>
  <span id="adapter-info">Initializing…</span>
</header>

<div class="workspace">

  <!-- Left: Controls -->
  <div class="panel">
    <div class="panel-title">Source &amp; Config</div>

    <div id="drop-zone">
      <div class="icon">📄</div>
      <p><strong>Drop invoice image here</strong><br>or click to browse<br><small>PNG · JPG · WEBP</small></p>
      <input type="file" id="file-input" accept="image/*" />
    </div>

    <div class="config-section">
      <div class="cfg-group">
        <label>Adaptive Threshold Window <span id="thresh-val">31</span></label>
        <input type="range" id="cfg-thresh" min="11" max="101" step="2" value="31">
      </div>
      <div class="cfg-group">
        <label>Threshold Bias <span id="bias-val">0.15</span></label>
        <input type="range" id="cfg-bias" min="0" max="0.5" step="0.01" value="0.15">
      </div>
      <div class="cfg-group">
        <label>Min Circle Radius <span id="minr-val">3</span>px</label>
        <input type="range" id="cfg-minr" min="1" max="20" step="1" value="3">
      </div>
      <div class="cfg-group">
        <label>Max Circle Radius <span id="maxr-val">40</span>px</label>
        <input type="range" id="cfg-maxr" min="10" max="120" step="1" value="40">
      </div>
      <div class="cfg-group">
        <label>Line Merge Gap <span id="gap-val">8</span>px</label>
        <input type="range" id="cfg-gap" min="2" max="40" step="1" value="8">
      </div>
      <div class="cfg-group">
        <label>Table Min Cols <span id="cols-val">2</span></label>
        <input type="range" id="cfg-cols" min="2" max="8" step="1" value="2">
      </div>
      <div class="cfg-group">
        <label>Morph Kernel Size <span id="morph-val">5</span></label>
        <input type="range" id="cfg-morph" min="3" max="15" step="2" value="5">
      </div>
    </div>

    <button class="run-btn" id="run-btn" disabled>⚡ Process Invoice</button>

    <div class="panel-title" style="border-top: 1px solid var(--border);">Pipeline Trace</div>
    <div id="pipeline-log"></div>
  </div>

  <!-- Center: Canvas -->
  <div class="canvas-area">
    <canvas id="main-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>

    <div class="view-tabs">
      <button class="view-tab active" data-view="original">Original</button>
      <button class="view-tab" data-view="gray">Grayscale</button>
      <button class="view-tab" data-view="thresh">Threshold</button>
      <button class="view-tab" data-view="sdf">SDF</button>
      <button class="view-tab" data-view="circles">Circles</button>
      <button class="view-tab" data-view="lines">Text Lines</button>
      <button class="view-tab" data-view="table">Table</button>
    </div>

    <div class="stats-bar" id="stats-bar" style="display:none">
      <div class="stat"><span class="stat-label">GPU</span><span class="stat-val" id="s-gpu">—</span></div>
      <div class="stat"><span class="stat-label">Circles</span><span class="stat-val" id="s-circles">—</span></div>
      <div class="stat"><span class="stat-label">Lines</span><span class="stat-val" id="s-lines">—</span></div>
      <div class="stat"><span class="stat-label">Cells</span><span class="stat-val" id="s-cells">—</span></div>
      <div class="stat"><span class="stat-label">Total</span><span class="stat-val" id="s-total">—</span></div>
    </div>
  </div>

  <!-- Right: Output -->
  <div class="right-panel">
    <div class="panel-title">
      Structured Output
      <button class="copy-btn" id="copy-btn">Copy JSON</button>
    </div>
    <div id="json-output">// Run the engine to see structured invoice data</div>
    <div id="table-preview"></div>
  </div>

</div>

<div id="toast">✓ Copied to clipboard</div>

<!-- Tesseract.js for OCR (swap for ONNX TrOCR in production) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
