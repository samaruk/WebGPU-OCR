<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIDLIFT / InvoiceForensics</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #171b24;
    --panel-2: #1e232e;
    --line: #2a3140;
    --fg: #e6e9ef;
    --muted: #8b95a7;
    --accent: #5eb0ff;
    --ok: #4ec9a0;
    --warn: #e0b055;
    --bad: #e0715f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  h1 span { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select, input[type=text] {
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 11px; font: inherit; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #07101c; border-color: var(--accent); font-weight: 600; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0,1fr) 420px; gap: 0; height: calc(100vh - 59px); }
  #stage { position: relative; overflow: auto; background: #0a0d12; padding: 16px; }
  #stage canvas { display: block; max-width: 100%; box-shadow: 0 0 0 1px var(--line); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; }
  section { border-bottom: 1px solid var(--line); padding: 12px 14px; }
  section h2 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 3px 6px 3px 0; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  tr + tr td { border-top: 1px solid #232a36; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .meter { height: 4px; background: #232a36; border-radius: 2px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--accent); }
  .big { font-size: 26px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .muted { color: var(--muted); }
  pre {
    margin: 0; font-size: 11px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    max-height: 340px; overflow: auto; color: #b9c2d0;
  }
  .pill {
    display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .drop { border: 1px dashed var(--line); border-radius: 8px; padding: 40px; text-align: center; color: var(--muted); }
  #err { color: var(--bad); font-size: 12px; padding: 0 20px 10px; }
</style>
</head>
<body>
<header>
  <h1>GRIDLIFT <span>+ InvoiceForensics</span></h1>
  <div class="row">
    <input type="file" id="file" accept="image/*" hidden>
    <button class="primary" id="pick">Open invoice…</button>
    <select id="variant" title="Sample layout">
      <option value="bordered">bordered</option>
      <option value="borderless">borderless</option>
      <option value="broken">broken rules</option>
    </select>
    <button id="sample">Load sample</button>
    <select id="maxDim" title="Working resolution (long edge)">
      <option value="1200">1200 px</option>
      <option value="1800" selected>1800 px</option>
      <option value="2400">2400 px</option>
    </select>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="ov-rules" checked> rules</label>
    <label class="chk"><input type="checkbox" id="ov-comps"> components</label>
    <label class="chk"><input type="checkbox" id="ov-lines"> text lines</label>
    <label class="chk"><input type="checkbox" id="ov-cells" checked> cells</label>
    <label class="chk"><input type="checkbox" id="ov-cols" checked> columns</label>
    <label class="chk"><input type="checkbox" id="ov-regions"> regions</label>
    <label class="chk"><input type="checkbox" id="ov-esc" checked> escalations</label>
  </div>
  <div class="row">
    <select id="rectify" title="Page rectification">
      <option value="auto" selected>rectify: auto</option>
      <option value="true">rectify: force</option>
      <option value="false">rectify: off</option>
    </select>
    <label class="chk"><input type="checkbox" id="use-ocr" checked> tesseract.js (CDN)</label>
    <input type="text" id="sidecar" placeholder="PaddleOCR-VL endpoint (optional)" size="28">
  </div>
</header>
<div id="err" hidden></div>
<main>
  <div id="stage"><div class="drop" id="drop">Drop an invoice image here, or use “Open invoice…”.<br>
    <span class="muted">Chrome/Edge 113+ with WebGPU enabled.</span></div></div>
  <aside>
    <section>
      <h2>Confidence</h2>
      <div class="big" id="conf">—</div>
      <div class="meter"><i id="confbar" style="width:0"></i></div>
      <div class="muted" id="confnote" style="margin-top:6px;font-size:12px"></div>
    </section>
    <section><h2>Rectification</h2><div id="rect" class="muted" style="font-size:12px">—</div></section>
    <section><h2>Stage timings</h2><table id="timings"><tbody></tbody></table></section>
    <section><h2>Grid hypotheses</h2><div id="hyps" class="muted" style="font-size:12px">—</div></section>
    <section><h2>Columns</h2><table id="cols"><tbody></tbody></table></section>
    <section><h2>Line items</h2><table id="items"><tbody></tbody></table></section>
    <section><h2>Totals &amp; checks</h2><table id="checks"><tbody></tbody></table></section>
    <section>
      <h2>Geometry graph <button id="dl" style="float:right;padding:2px 8px;font-size:11px">Download JSON</button></h2>
      <pre id="json">—</pre>
    </section>
  </aside>
</main>
<script type="module" src="./src/demo/app.js"></script>
</body>
</html>
