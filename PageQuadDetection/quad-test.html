<!doctype html>
<meta charset="utf-8">
<title>quad test</title>
<style>body{font:13px monospace;background:#fff;color:#000} canvas.t{width:300px;margin:4px;border:1px solid #888}</style>
<div id="drop" style="border:2px dashed #888;padding:14px;margin:8px 0;background:#f6f6f6">
  <b>Test your own photo:</b> drop an image here or
  <input type="file" id="file" accept="image/*" multiple>
  &nbsp; min page area <input type="number" id="minArea" value="0.25" step="0.05" min="0.05" max="0.9" style="width:60px">
  <label><input type="checkbox" id="refine" checked> sub-pixel refinement</label>
</div>
<div id="user"></div>
<pre id="out">running…</pre>
<div id="thumbs"></div>
<script>
// ---- perspective rectification -------------------------------------------
// Warp the detected quad onto a flat rectangle. Output size comes from the
// mean lengths of opposite quad edges (capped at maxSide), so the page keeps
// its photographed aspect ratio. Inverse mapping with bilinear sampling.
function rectify(source, det, maxSide){
  const {tl,tr,br,bl}=det;
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  let W=(d(tl,tr)+d(bl,br))/2, H=(d(tl,bl)+d(tr,br))/2;
  const k=Math.min(1, maxSide/Math.max(W,H)); W=Math.max(8,Math.round(W*k)); H=Math.max(8,Math.round(H*k));
  // homography: output (0,0),(W,0),(W,H),(0,H) -> tl,tr,br,bl
  const Hm=homography([[0,0],[W,0],[W,H],[0,H]],[[tl.x,tl.y],[tr.x,tr.y],[br.x,br.y],[bl.x,bl.y]]);
  const sw=source.naturalWidth||source.width, sh=source.naturalHeight||source.height;
  const sc=document.createElement('canvas'); sc.width=sw; sc.height=sh; sc.getContext('2d').drawImage(source,0,0);
  const S=sc.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas'); out.width=W; out.height=H; const og=out.getContext('2d');
  const id=og.createImageData(W,H), O=id.data;
  const [h0,h1,h2,h3,h4,h5,h6,h7,h8]=Hm;
  for(let v=0,o=0;v<H;v++){
    const vy=v+0.5;
    for(let u=0;u<W;u++,o+=4){
      const ux=u+0.5, w=h6*ux+h7*vy+h8;
      const x=(h0*ux+h1*vy+h2)/w-0.5, y=(h3*ux+h4*vy+h5)/w-0.5;   // source pixel centres at +0.5
      const x0=Math.floor(x), y0=Math.floor(y);
      if(x0<0||y0<0||x0>=sw-1||y0>=sh-1){ O[o]=O[o+1]=O[o+2]=255; O[o+3]=255; continue; }
      const fx=x-x0, fy=y-y0, i00=(y0*sw+x0)*4, i01=i00+4, i10=i00+sw*4, i11=i10+4;
      const w00=(1-fx)*(1-fy), w01=fx*(1-fy), w10=(1-fx)*fy, w11=fx*fy;
      O[o]  =S[i00]*w00+S[i01]*w01+S[i10]*w10+S[i11]*w11;
      O[o+1]=S[i00+1]*w00+S[i01+1]*w01+S[i10+1]*w10+S[i11+1]*w11;
      O[o+2]=S[i00+2]*w00+S[i01+2]*w01+S[i10+2]*w10+S[i11+2]*w11;
      O[o+3]=255;
    }
  }
  og.putImageData(id,0,0);
  return out;
}
// 3x3 homography (row-major, h8 normalised to 1) mapping src[i] -> dst[i], 4 point pairs (DLT, Gaussian elimination)
function homography(src, dst){
  const A=[], b=[];
  for(let i=0;i<4;i++){ const [x,y]=src[i], [X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-X*x,-X*y]); b.push(X);
    A.push([0,0,0,x,y,1,-Y*x,-Y*y]); b.push(Y); }
  const n=8; for(let i=0;i<n;i++) A[i].push(b[i]);
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]];
    const piv=A[c][c]||1e-12;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=A[r][c]/piv; if(!f) continue; for(let j=c;j<=n;j++) A[r][j]-=f*A[c][j]; }
  }
  const h=A.map((row,i)=>row[n]/(row[i]||1e-12));
  return [...h,1];
}

// ---- user image upload -------------------------------------------------
function runUserImage(file){
  const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    const cv=document.createElement('canvas'); cv.width=img.naturalWidth; cv.height=img.naturalHeight;
    cv.getContext('2d').drawImage(img,0,0);
    const dbg=[]; const opts={debug:dbg, minAreaFrac:+document.getElementById('minArea').value||0.25, refine:document.getElementById('refine').checked};
    const t0=performance.now(); let det=null, err=null;
    try { det=detectPageQuad(cv,opts); } catch(e){ err=e; }
    const ms=(performance.now()-t0).toFixed(0);
    const g=cv.getContext('2d'); g.lineWidth=Math.max(2,cv.width/400);
    if(det){ const q=[det.tl,det.tr,det.br,det.bl]; g.strokeStyle='red'; g.beginPath(); g.moveTo(q[0].x,q[0].y); for(let i=1;i<4;i++) g.lineTo(q[i].x,q[i].y); g.closePath(); g.stroke();
      g.fillStyle='red'; g.beginPath(); g.arc(det.tl.x,det.tl.y,cv.width/80,0,7); g.fill(); }
    const box=document.createElement('div'); box.style.cssText='margin:8px 0;padding:8px;border:1px solid #ccc';
    const info=document.createElement('pre');
    // rectify: warp the detected quad to a flat rectangle
    let rect=null, rectMs=0;
    if(det){ const t1=performance.now(); rect=rectify(img, det, 2400); rectMs=(performance.now()-t1).toFixed(0); }
    info.textContent=`${file.name} ${cv.width}x${cv.height} — ${err?('ERROR '+err.message):det?'detected':'no page found'} in ${ms}ms`+
      (det?`\ntl (${det.tl.x.toFixed(1)}, ${det.tl.y.toFixed(1)})  tr (${det.tr.x.toFixed(1)}, ${det.tr.y.toFixed(1)})\nbr (${det.br.x.toFixed(1)}, ${det.br.y.toFixed(1)})  bl (${det.bl.x.toFixed(1)}, ${det.bl.y.toFixed(1)})`:'')+
      (rect?`\nrectified ${rect.width}x${rect.height} in ${rectMs}ms`:'')+
      '\n--- debug ---\n'+dbg.join('\n');
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap';
    const col=(title,canvas)=>{ const d=document.createElement('div'); d.style.cssText='flex:1 1 300px;min-width:0'; const h=document.createElement('div'); h.textContent=title; h.style.cssText='font-weight:bold;margin:2px 0'; canvas.style.cssText='max-width:100%;height:auto;display:block;border:1px solid #888'; d.appendChild(h); d.appendChild(canvas); return d; };
    row.appendChild(col('Detected page quad', cv));
    if(rect){ const d=col('Rectified page', rect); const a=document.createElement('a'); a.textContent='Save rectified PNG'; a.href='#'; a.style.cssText='display:inline-block;margin:4px 0'; a.onclick=e=>{ e.preventDefault(); rect.toBlob(b=>{ const u=URL.createObjectURL(b); const l=document.createElement('a'); l.href=u; l.download=file.name.replace(/\.[^.]+$/,'')+'-rectified.png'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),5000); },'image/png'); }; d.appendChild(a); row.appendChild(d); }
    box.appendChild(row); box.appendChild(info);
    document.getElementById('user').prepend(box);
  };
  img.onerror=()=>alert('Could not decode '+file.name);
  img.src=url;
}
document.getElementById('file').addEventListener('change',e=>{ for(const f of e.target.files) runUserImage(f); e.target.value=''; });
const dz=document.getElementById('drop');
dz.addEventListener('dragover',e=>{ e.preventDefault(); dz.style.background='#e0eeff'; });
dz.addEventListener('dragleave',()=>{ dz.style.background='#f6f6f6'; });
dz.addEventListener('drop',e=>{ e.preventDefault(); dz.style.background='#f6f6f6'; for(const f of e.dataTransfer.files) if(f.type.startsWith('image/')) runUserImage(f); });
document.addEventListener('paste',e=>{ for(const it of e.clipboardData.items) if(it.type.startsWith('image/')) runUserImage(it.getAsFile()); });
</script>
<script>
/* detectPageQuad.js
   Locate the four corners of a document page in a canvas.

   detectPageQuad(canvas [, opts]) -> {tl, tr, br, bl} in full-resolution
   canvas coordinates (clockwise, y down), or null when no clear page is found.

   Pipeline
     1. Downscale to ~900 px, convert to Y/Cb/Cr, blur lightly.
     2. Paper reference colour = the dominant luma mode of the frame centre
        (robust to text, tables and photos), then a "distance to paper colour"
        map. Colour + luma separates paper from a desk far better than a global
        luma threshold and is much less sensitive to shadows.
     3. Candidate segmentations, tried in order until one scores well:
          - distance map thresholded at Otsu (on a log scale, so ink does not
            hijack the split) x 1 / 0.7 / 1.4, floored at 3x the paper noise;
          - region growing from the centre over low-gradient pixels, which
            survives lighting gradients that defeat any global threshold;
          - the legacy luma-Otsu mask.
        Each mask is hole-filled (print becomes paper), opened (thin bridges to
        a bright background are cut) and reduced to the component under the
        frame centre.
     4. Boundary -> convex hull -> max-area inscribed quad -> total-least-squares
        line fit per edge -> corners from line intersections. Candidates are
        scored by convexity x quad fill x edge contrast, and shape-validated
        (convex, plausible angles, real contrast step on every visible edge).
     5. Sub-pixel refinement at (near) full resolution. Along each edge, every
        sample contributes all its edge-response peaks (sub-pixel, parabolic)
        within a narrow window around the rough edge; a Hough vote over
        (slope, offset) finds candidate straight lines, each refitted on its
        inliers. Lines are ranked by the number of samples supporting them,
        preferring lines with paper on the inside and non-paper on the
        outside. Corners are the intersections of the refined lines.
     6. Edge recovery (sweep). When no line is found near the rough edge, or
        the edge had no evidence in the segmentation (merged with a
        reflection, a second sheet, a white wall), or the found line is weak
        with paper on both sides, the search widens far inward and moderately
        outward. Candidates are tried from the outermost inward; a line is
        accepted only if, per sample, it separates paper from non-paper, the
        strip between it and the rough edge is non-paper where it lies inward
        (a glass reflection qualifies, a band of print does not) and paper
        where it lies outward, and an outward move needs near-complete
        support. Print inside the page, table rules in full-frame scans and
        neighbouring sheets are therefore left alone.

   Known limits: a curled page edge is approximated by a straight line; two
   stacked white sheets are separated only where a crease or shadow line is
   visible; a page whose edge borders another white sheet along its whole
   length keeps the segmentation's rough edge.

   opts: workSize (900), minAreaFrac (0.40), refine (true), maxRefinePixels
   (24e6), debug (array to receive diagnostics). */

function detectPageQuad(canvas, opts = {}) {
  const o = Object.assign({
    workSize: 900,          // long side of the segmentation image, px
    minAreaFrac: 0.40,      // page must cover this fraction of the frame
    refine: true,           // sub-pixel edge refinement at high resolution
    maxRefinePixels: 24e6,  // refinement image is capped at this many pixels
    debug: null,            // pass an array to receive per-candidate diagnostics
  }, opts);
  const log = o.debug ? (...a) => o.debug.push(a.join(' ')) : () => {};
  const now = typeof performance !== 'undefined' ? () => performance.now() : Date.now;
  const T0 = now(), tick = what => log(what, 'at', (now() - T0).toFixed(0) + 'ms');

  const CW = canvas.width, CH = canvas.height;
  if (CW < 32 || CH < 32) return null;

  /* 1. segmentation image + features ------------------------------------ */
  const sc = Math.min(1, o.workSize / Math.max(CW, CH));
  const w = Math.max(32, Math.round(CW * sc)), h = Math.max(32, Math.round(CH * sc)), N = w * h;
  const px = readPixels(canvas, w, h);
  const f = toYCbCr(px, N);
  const Y = box3(f.Y, w, h), Cb = box3(f.Cb, w, h), Cr = box3(f.Cr, w, h);

  // paper reference colour: the dominant luma mode of the central window
  // (the median fails when text, tables or a photo cover half the window),
  // then per-channel medians over the pixels belonging to that mode
  const win = [(w * 0.35) | 0, (w * 0.65) | 0, (h * 0.35) | 0, (h * 0.65) | 0];
  const paper = paperPixels(Y, w, win);
  const ref = [medianOf(Y, paper), medianOf(Cb, paper), medianOf(Cr, paper)];

  // distance-to-paper map. The threshold comes from Otsu on a log-compressed
  // copy: on a linear scale dark ink (distance ~255) dominates the variance
  // and Otsu then separates ink from "paper + desk" instead of paper from desk.
  const D = new Uint8Array(N), Dlog = new Uint8Array(N), LOG = 255 / Math.log(256);
  for (let i = 0; i < N; i++) {
    D[i] = paperDist(Y[i], Cb[i], Cr[i], ref);
    Dlog[i] = Math.log(1 + D[i]) * LOG;
  }
  const tOtsu = Math.exp(otsu(Dlog) / LOG) - 1;
  // noise floor: paper pixels have |noise|-like distances, sigma ~ 1.48 x median
  const nD = 1.4826 * (medianOf(D, paper) + 0.5);
  const tD = Math.max(3, tOtsu, 3 * nD);
  const sd = diffNoise(Y, paper);
  tick('features');
  log('ref', ref.join(','), 'paper px', paper.length, 'tOtsu', tOtsu.toFixed(1), 'noise', nD.toFixed(1), 'tD', tD.toFixed(1), 'diff noise', sd.toFixed(2));

  /* 2. candidate segmentations ------------------------------------------ */
  // Candidates are tried from most to least likely and the search stops as
  // soon as one scores >= GOOD: the refinement stage only needs a rough quad
  // within a few pixels of the page, so later candidates cannot improve on it.
  const GOOD = 0.95;
  const cands = [];
  const done = () => cands.length && cands[0].score >= GOOD && !cands[0].weak;
  const consider = (mask, tag) => {
    const c = quadFromMask(mask, w, h, o.minAreaFrac, (...m) => log(tag + ':', ...m));
    if (!c) return;
    // visible edges must show real image evidence (a colour step or a thin
    // edge line); this rejects bands produced by thresholding a smooth
    // lighting gradient. One visible edge may be weak: a second sheet under
    // the page or a bright reflection can hide most of an edge.
    const ec = edgeContrast(Y, Cb, Cr, D, w, h, c.quad, 3);
    log(tag + ': conv*fill', c.score.toFixed(3), 'edges', ec.inFrame, 'strong', ec.strong, 'steps', ec.steps.map(v => v.toFixed(1)).join('/'));
    if (ec.inFrame < 2 || ec.strong < Math.max(2, ec.inFrame - 1)) return;
    c.score *= Math.min(1, ec.meanStep / Math.max(10, 0.5 * tD));
    c.weak = ec.strong < ec.inFrame;
    c.weakEdge = ec.edge.map(v => v !== null && v < 6);
    if (c.weak) c.score *= 0.85;                         // never beats a candidate with all edges seen
    if (ec.inFrame < 4) c.score *= 0.9;                  // an edge on the frame border is usually a leak into a bright surround
    c.tag = tag; cands.push(c);
    cands.sort((a, b) => (b.score - a.score) || (a.area - b.area));
  };
  const tried = [];
  for (const k of [1, 0.7, 1.4]) {
    if (done()) break;
    const t = Math.max(tD * k, 3 * nD);
    if (tried.some(u => Math.abs(u - t) < 0.1 * t)) continue;   // collapsed onto the noise floor
    tried.push(t);
    const m = new Uint8Array(N);
    for (let i = 0; i < N; i++) m[i] = D[i] <= t ? 1 : 0;
    consider(m, 'dist' + k);
    tick('dist' + k);
  }
  if (!done()) {
    // region growing from the centre over low-gradient pixels: immune to the
    // smooth lighting gradients that defeat any global threshold. Gradient
    // magnitude is isotropic; a plain neighbour-difference test leaks through
    // edges that run at a shallow angle to the pixel grid.
    const G = gradMag(Y, Cb, Cr, w, h);
    consider(growFromCentre(G, D, w, h, win, Math.max(2, 3.5 * sd)), 'grow-tight');
    if (!done()) consider(growFromCentre(G, D, w, h, win, Math.max(3, 6 * sd)), 'grow-loose');
    tick('grow');
  }
  if (!done()) {
    const tY = otsu(Y); let br = 0, dk = 0;
    for (let y = win[2]; y < win[3]; y++)
      for (let x = win[0]; x < win[1]; x++) (Y[y * w + x] > tY ? br++ : dk++);
    const bright = br >= dk, m = new Uint8Array(N);
    for (let i = 0; i < N; i++) m[i] = ((Y[i] > tY) === bright) ? 1 : 0;
    consider(m, 'luma');
    tick('luma');
  }
  if (!cands.length) return null;
  log('winner', cands[0].tag, cands[0].score.toFixed(3),
      'others', cands.slice(1).map(c => c.tag + '=' + c.score.toFixed(3)).join(' '));
  const quad = cands[0].quad, weakEdge = cands[0].weakEdge; // low-res, [tl,tr,br,bl]

  /* 3. sub-pixel refinement at high resolution --------------------------- */
  if (o.refine) {
    let sc2 = Math.min(1, Math.sqrt(o.maxRefinePixels / (CW * CH))), px2 = px, W2 = w, H2 = h;
    if (sc2 > sc * 1.1) {
      W2 = Math.max(32, Math.round(CW * sc2)); H2 = Math.max(32, Math.round(CH * sc2));
      px2 = readPixels(canvas, W2, H2);
    } else sc2 = sc;                                     // refine on the analysis image itself
    const k = sc2 / sc;
    const qr = quad.map(p => ({ x: p.x * k, y: p.y * k }));
    const R = Math.min(80, Math.max(6, Math.round(3 * k) + 3));
    const minG = Math.max(4, 0.1 * tD);
    tick('refine image read');
    const refined = refineEdges(px2, W2, H2, qr, ref, R, minG, weakEdge, log);
    tick('refine');
    if (refined && validQuad(refined, 0.04 * Math.hypot(W2, H2))) return toResult(refined, 1 / sc2);
    log('refinement rejected, using rough quad');
  }
  return toResult(quad, 1 / sc);
}

/* ---------------------------------------------------------------------- */
/* segmentation -> rough quad                                              */

function quadFromMask(mask0, w, h, minAreaFrac, log) {
  const N = w * h;
  let mask = fillHoles(mask0, w, h);
  const r = Math.max(1, Math.round(Math.min(w, h) * 0.006));
  mask = dilate(erode(mask, w, h, r), w, h, r);

  const cc = components(mask, w, h);
  if (!cc.count) return null;
  const cxh = w >> 1, cyh = h >> 1;
  let L = cc.labels[cyh * w + cxh];
  if (L < 0) {
    let bestA = -1;
    for (let l = 0; l < cc.count; l++) {
      const hits = cc.bx0[l] <= cxh && cc.bx1[l] >= cxh && cc.by0[l] <= cyh && cc.by1[l] >= cyh;
      if (hits && cc.area[l] > bestA) { bestA = cc.area[l]; L = l; }
    }
  }
  if (L < 0) { log('no component under centre'); return null; }
  const area = cc.area[L];
  if (area < minAreaFrac * N) { log('area', (area / N).toFixed(3), '< minAreaFrac'); return null; }

  // a "page" that owns most of the frame border is the background
  let bt = 0;
  for (let x = 0; x < w; x++) { if (cc.labels[x] === L) bt++; if (cc.labels[(h - 1) * w + x] === L) bt++; }
  for (let y = 0; y < h; y++) { if (cc.labels[y * w] === L) bt++; if (cc.labels[y * w + w - 1] === L) bt++; }
  if (bt > 0.6 * (2 * w + 2 * h)) { log('component owns the frame border'); return null; }

  // boundary extremes per row / column (rotation independent)
  const minX = new Int32Array(h).fill(1e9), maxX = new Int32Array(h).fill(-1);
  const minY = new Int32Array(w).fill(1e9), maxY = new Int32Array(w).fill(-1);
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) {
    if (cc.labels[i] !== L) continue;
    if (x < minX[y]) minX[y] = x; if (x > maxX[y]) maxX[y] = x;
    if (y < minY[x]) minY[x] = y; if (y > maxY[x]) maxY[x] = y;
  }
  const bnd = [];
  for (let y = 0; y < h; y++) if (maxX[y] >= 0) { bnd.push({ x: minX[y], y }); bnd.push({ x: maxX[y], y }); }
  for (let x = 0; x < w; x++) if (maxY[x] >= 0) { bnd.push({ x, y: minY[x] }); bnd.push({ x, y: maxY[x] }); }

  const hull = convexHull(bnd);
  if (hull.length < 4) return null;
  const hullA = polyArea(hull);
  if (hullA <= 0) return null;
  const conv = area / hullA;                 // notches (fingers, clips) lower this
  if (conv < 0.75) { log('convexity', conv.toFixed(3)); return null; }

  let poly = simplifyClosed(hull, 1.5), eps = 1.5;
  while (poly.length > 28) { eps *= 1.5; poly = simplifyClosed(hull, eps); }
  const q0 = maxAreaQuad(poly);
  if (!q0) return null;
  const fill = polyArea(q0) / hullA;         // how quadrilateral the hull is
  if (fill < 0.8) { log('quad fill', fill.toFixed(3)); return null; }

  const quad = fitEdges(bnd, orderCorners(q0), Math.max(2, 0.01 * Math.hypot(w, h)));
  if (!validQuad(quad, 0.04 * Math.hypot(w, h))) { log('implausible quad shape'); return null; }
  return { quad, score: conv * fill, area };
}

// replace each rough edge by a total-least-squares fit through the boundary
// points lying near it (away from the corners), then intersect
function fitEdges(bnd, quad, tol) {
  const lines = quad.map((A, i) => {
    const B = quad[(i + 1) % 4];
    const L = lineThrough(A, B);
    if (!L) return null;
    const dx = B.x - A.x, dy = B.y - A.y, len2 = dx * dx + dy * dy;
    const sel = [];
    for (const p of bnd) {
      if (Math.abs(L.a * p.x + L.b * p.y + L.c) > tol) continue;
      const t = ((p.x - A.x) * dx + (p.y - A.y) * dy) / len2;
      if (t >= 0.08 && t <= 0.92) sel.push(p);
    }
    return sel.length >= 10 ? tlsLine(sel) : L;
  });
  return cornersFromLines(lines, quad, 1e9);
}

// indices of the window pixels belonging to the paper: the luma mode of the
// window (smoothed over +-12 so a lighting gradient still counts as one
// mode); when several modes are comparable the brightest wins, because print
// and photos are darker than the paper they sit on
function paperPixels(Y, w, [x0, x1, y0, y1]) {
  const hist = new Int32Array(256), sm = new Float64Array(256);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) hist[Y[y * w + x]]++;
  let best = 0;
  for (let v = 0; v < 256; v++) {
    let c = 0;
    for (let k = Math.max(0, v - 12); k <= Math.min(255, v + 12); k++) c += hist[k];
    sm[v] = c; if (c > best) best = c;
  }
  let mode = 0;
  for (let v = 0; v < 256; v++) {
    const peak = sm[v] >= 0.5 * best && (v === 0 || sm[v] >= sm[v - 1]) && (v === 255 || sm[v] > sm[v + 1]);
    if (peak) mode = v;                                  // last (brightest) qualifying peak
  }
  const idx = [];
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
    const i = y * w + x;
    if (Math.abs(Y[i] - mode) <= 14) idx.push(i);
  }
  return idx;
}

function medianOf(arr, idx) {
  const hist = new Int32Array(256);
  for (const i of idx) hist[arr[i]]++;
  let acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc * 2 >= idx.length) return v; }
  return 255;
}

// robust noise estimate: 1.4826 x median |horizontal neighbour difference|
// over pairs of paper pixels
function diffNoise(Y, idx) {
  const hist = new Int32Array(256); let n = 0;
  const set = new Set(idx);
  for (const i of idx) if (set.has(i + 1)) { hist[Math.abs(Y[i + 1] - Y[i])]++; n++; }
  if (!n) return 2;
  let acc = 0;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc * 2 >= n) return 1.4826 * (v + 0.5); }
  return 255;
}

// per-pixel gradient magnitude (central differences), max over Y/Cb/Cr
function gradMag(Y, Cb, Cr, w, h) {
  const G = new Float32Array(w * h);
  const mag = (A, i, xl, xr, yu, yd) => {
    const gx = (A[i + xr] - A[i - xl]) / 2, gy = (A[i + yd] - A[i - yu]) / 2;
    return Math.sqrt(gx * gx + gy * gy);
  };
  for (let y = 0, i = 0; y < h; y++) for (let x = 0; x < w; x++, i++) {
    const xl = x > 0 ? 1 : 0, xr = x < w - 1 ? 1 : 0, yu = y > 0 ? w : 0, yd = y < h - 1 ? w : 0;
    G[i] = Math.max(mag(Y, i, xl, xr, yu, yd), mag(Cb, i, xl, xr, yu, yd), mag(Cr, i, xl, xr, yu, yd));
  }
  return G;
}

// flood fill from paper-like seeds in the central window over pixels whose
// gradient magnitude is at most t
function growFromCentre(G, D, w, h, [x0, x1, y0, y1], t) {
  const N = w * h, mask = new Uint8Array(N), stack = new Int32Array(N);
  let sp = 0;
  const tSeed = 2 + Math.max(3, t);
  for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) {
    const i = y * w + x;
    if (D[i] <= tSeed && G[i] <= t && !mask[i]) { mask[i] = 1; stack[sp++] = i; }
  }
  const tryJoin = j => { if (!mask[j] && G[j] <= t) { mask[j] = 1; stack[sp++] = j; } };
  while (sp) {
    const i = stack[--sp], x = i % w;
    if (x > 0) tryJoin(i - 1); if (x < w - 1) tryJoin(i + 1);
    if (i >= w) tryJoin(i - w); if (i < N - w) tryJoin(i + w);
  }
  return mask;
}

// image evidence for each edge, sampled along its inner 80%. At each sample
// the evidence is the larger of: the signed paper-distance increase from d px
// inside to d px outside; 0.8 x the colour difference between those two
// points (keeps edges alive under a lighting gradient, where the far side of
// the page can be further from the reference than the desk is); and the
// strongest colour gradient within +-d px (a thin crease or shadow line is all
// that separates two stacked white sheets). The per-edge statistic is the
// 60th percentile, so an edge still counts when up to 40% of it is hidden by
// a same-coloured object.
function edgeContrast(Y, Cb, Cr, D, w, h, quad, d) {
  let inFrame = 0, strong = 0, sum = 0;
  const steps = [], edge = [null, null, null, null];
  const at = (x, y) => (Math.round(y) * w + Math.round(x));
  const inside = (x, y) => x >= 1 && y >= 1 && x < w - 1 && y < h - 1;
  for (let i = 0; i < 4; i++) {
    const A = quad[i], B = quad[(i + 1) % 4];
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
    const nx = dy / len, ny = -dx / len;                 // outward (clockwise, y down)
    const ev = [], K = 40;
    for (let k = 0; k < K; k++) {
      const t = 0.1 + 0.8 * (k + 0.5) / K;
      const cx = A.x + dx * t, cy = A.y + dy * t;
      if (!inside(cx + nx * (d + 1), cy + ny * (d + 1)) || !inside(cx - nx * (d + 1), cy - ny * (d + 1))) continue;
      const o = at(cx + nx * d, cy + ny * d), n = at(cx - nx * d, cy - ny * d);
      let e = Math.max(D[o] - D[n], 0.8 * colourStep(Y[o] - Y[n], Cb[o] - Cb[n], Cr[o] - Cr[n]));
      for (let s = -d; s <= d; s++) {                    // thin-line evidence
        const a = at(cx + nx * (s - 1), cy + ny * (s - 1)), b = at(cx + nx * (s + 1), cy + ny * (s + 1));
        e = Math.max(e, 0.8 * colourStep(Y[b] - Y[a], Cb[b] - Cb[a], Cr[b] - Cr[a]));
      }
      ev.push(e);
    }
    if (ev.length < K / 2) continue;                     // edge is (mostly) outside the frame
    ev.sort((a, b) => a - b);
    const q60 = ev[Math.min(ev.length - 1, Math.floor(ev.length * 0.6))];
    inFrame++; sum += q60; steps.push(q60); edge[i] = q60; if (q60 >= 6) strong++;
  }
  return { inFrame, strong, steps, edge, meanStep: inFrame ? sum / inFrame : 0 };
}

function cornersFromLines(lines, fallback, maxMove) {
  return fallback.map((q, i) => {
    const a = lines[(i + 3) % 4], b = lines[i];
    const c = a && b ? intersect(a, b) : null;
    return c && Math.hypot(c.x - q.x, c.y - q.y) <= maxMove ? c : q;
  });
}

/* ---------------------------------------------------------------------- */
/* high-resolution edge refinement                                         */

function refineEdges(px, W, H, q, ref, R, minG, weakEdge, log) {
  const sampler = makeSampler(px, W, H, ref);
  const lines = [], recovered = [false, false, false, false];
  log('rough quad', q.map(p => `(${p.x.toFixed(1)},${p.y.toFixed(1)})`).join(' '), 'R', R, 'minG', minG.toFixed(1), 'ref', ref.join(','));
  const mid = i => ({ x: (q[i].x + q[(i + 1) % 4].x) / 2, y: (q[i].y + q[(i + 1) % 4].y) / 2 });
  for (let i = 0; i < 4; i++) {
    const A = q[i], B = q[(i + 1) % 4];
    const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
    let L = lineThrough(A, B);
    if (!L) { lines.push(null); continue; }
    const ux = dx / len, uy = dy / len, nx = uy, ny = -ux;   // outward normal (clockwise quad, y down)
    const K = Math.min(96, Math.max(24, Math.round(len / 6)));
    // A page edge separates paper (inside) from non-paper (outside). Every
    // candidate line is probed 4..14 px either side; this rejects table rules
    // and text baselines (paper on both sides) and soft shadow borders.
    // All tests are per sample against that sample's own paper reading just
    // inside the line, so shading across the page does not matter.
    // paperOK: on >= 60% of samples the outside is clearly not paper.
    const paperOK = c => c.paperFrac >= 0.6;
    // stripOK: where the line lies inward of the rough edge the strip in between
    // must not be paper (else the page simply continues, e.g. out of frame or a
    // table rule in a full-frame scan) on >= 70% of those samples individually
    // (a glass reflection is, a band of print with paper between the lines is
    // not); where it lies outward the strip must BE paper on >= 70% (else the
    // line belongs to another object).
    const stripOK = c => (c.stripFrac !== c.stripFrac || c.stripFrac >= 0.7) && (c.stripOutFrac !== c.stripOutFrac || c.stripOutFrac >= 0.7);
    const fmt = c => `support ${(c.support * 100).toFixed(0)}% rms ${c.rms.toFixed(2)} offset ${c.offset.toFixed(1)} D in ${c.insideD.toFixed(1)} out ${c.outsideD.toFixed(1)} paper ${(c.paperFrac * 100).toFixed(0)}% strip ${(c.stripFrac * 100).toFixed(0)}%/${(c.stripOutFrac * 100).toFixed(0)}%`;

    // 1. line search in a narrow window around the rough edge, then in a wide
    //    one (a rough edge rotated against the true edge only overlaps it in
    //    part). Every sample contributes all its edge-response peaks and a
    //    Hough vote ranks lines by the number of samples supporting them, so
    //    a faint but collinear edge beats scattered noise peaks.
    const res = findEdgeLine(sampler, A, B, ux, uy, nx, ny, len, K, R, R, minG, 0.4, 'support');
    let pick = null;
    if (res.ok) {
      // lines that separate paper from non-paper first (a crease between two
      // sheets has paper on both sides, so fall back to all); then the best
      // supported, straightest one: a sharp edge has tiny residuals, a carpet
      // of soft shadow peaks does not
      const pool = res.cands.filter(paperOK);
      pick = (pool.length ? pool : res.cands).reduce((a, c) => (c.support - a.support > 0.05 || (Math.abs(c.support - a.support) <= 0.05 && c.rms < a.rms)) ? c : a);
      L = pick.line;
    }
    log('edge', i, 'fit +-' + R, 'in frame', res.valid, pick ? fmt(pick) : 'no consensus');
    if (res.ok && res.cands.length > 1) log('edge', i, 'candidates:', res.cands.map(c => `[${c.offset.toFixed(1)} s${(c.support * 100).toFixed(0)} r${c.rms.toFixed(2)} D${c.insideD.toFixed(0)}/${c.outsideD.toFixed(0)}${paperOK(c) ? '*' : ''}]`).join(' '));

    // 2. Sweep when no line was found near the rough edge (it is rotated
    //    against the true edge, or sits on a merged reflection / second sheet
    //    / white wall) or when the edge is weak. The search reaches far inward
    //    and moderately outward; candidate lines are tried from the outermost
    //    inward and the first that separates paper from non-paper AND whose
    //    strip up to the rough edge is not paper wins (a paper strip means the
    //    page simply continues: out of frame, or a table rule in a full-frame
    //    scan). Print inside the page can therefore never beat the page edge.
    // Also when the pick has paper on both sides AND is poorly supported: a
    // rough edge lying inside the page finds only scattered print there. (A
    // crease between two stacked sheets also has paper on both sides, but it
    // is a real line with high support and must not be swept away.)
    if (!pick || pick.support < 0.7 && (!paperOK(pick) || (weakEdge && weakEdge[i]))) {
      const m = mid(i), o = mid((i + 2) % 4);
      const depth = Math.abs((o.x - m.x) * nx + (o.y - m.y) * ny);
      const range = Math.round(Math.min(0.35 * depth, 0.3 * Math.max(W, H)));
      const rec = findEdgeLine(sampler, A, B, ux, uy, nx, ny, len, K, range, Math.max(24, Math.round(0.08 * len)), Math.max(6, minG), 0.6, 'outer');
      // An edge that had clear evidence at its rough position may move outward
      // only a little and only for a very well supported line: a paper-
      // coloured strip out there is usually another sheet, not this page.
      const weak = weakEdge && weakEdge[i];
      const outOK = c => c.offset <= 2 || weak || (c.offset < 0.05 * len && c.support >= 0.85);
      let hit = rec.ok ? rec.cands.find(c => Math.abs(c.offset) > 2 && outOK(c) && paperOK(c) && stripOK(c)) : null;
      log('edge', i, pick ? 'weak;' : 'no line;', 'sweep', range + 'px ->', rec.ok ? rec.cands.length + ' lines, ' + (hit ? fmt(hit) + ' ACCEPTED' : 'none passes the paper tests: kept') : 'nothing consistent');
      if (!hit && !pick) {
        // Last resort: the edge may be visible along only part of its length
        // (a page on a stack of white sheets shows its edge against the desk
        // only near a corner). Accept a line whose inliers form one contiguous
        // run of >= 25% of the edge with a strong response, passing the paper
        // tests on >= 80% of that run, and staying on paper elsewhere.
        const rec2 = findEdgeLine(sampler, A, B, ux, uy, nx, ny, len, K, range, Math.max(24, Math.round(0.08 * len)), Math.max(6, minG), 0.25, 'outer');
        const partialOK = c => {
          if (Math.abs(c.offset) <= 2 || !outOK(c) || c.run.frac < 0.25) return false;
          if (c.run.strength < 2 * Math.max(6, minG) || c.insideFrac < 0.7) return false;
          let np = 0, nt = 0, ns = 0, nst = 0;
          for (let k = c.run.k0; k <= c.run.k1; k++) {
            if (c.okPaper[k] !== undefined) { nt++; np += c.okPaper[k]; }
            if (c.okStrip[k] !== undefined) { nst++; ns += c.okStrip[k]; }
          }
          return nt >= 5 && np / nt >= 0.8 && (nst < 5 || ns / nst >= 0.8);
        };
        hit = rec2.ok ? rec2.cands.find(partialOK) : null;
        log('edge', i, 'partial-edge sweep ->', rec2.ok ? rec2.cands.length + ' lines, ' + (hit ? fmt(hit) + ` run ${(hit.run.frac * 100).toFixed(0)}% strength ${hit.run.strength.toFixed(0)} ACCEPTED` : 'none qualifies') : 'nothing consistent');
      }
      if (rec.ok && !hit) log('edge', i, 'sweep candidates:', rec.cands.slice(0, 12).map(c => `[${c.offset.toFixed(1)} s${(c.support * 100).toFixed(0)} paper${(c.paperFrac * 100).toFixed(0)}% strip${(c.stripFrac * 100).toFixed(0)}%/${(c.stripOutFrac * 100).toFixed(0)}%]`).join(' '));
      if (hit) { L = hit.line; recovered[i] = true; }
    }
    lines.push(L);
  }
  return q.map((c, i) => {
    const a = lines[(i + 3) % 4], b = lines[i];
    const x = a && b ? intersect(a, b) : null;
    const maxMove = (recovered[(i + 3) % 4] || recovered[i]) ? 0.4 * Math.hypot(W, H) : 4 * R;
    return x && Math.hypot(x.x - c.x, x.y - c.y) <= maxMove ? x : c;
  });
}

// bilinear colour sampler + edge-strength profiles at (near) full resolution
function makeSampler(px, W, H, ref) {
  const v = new Float32Array(4);
  const sample = (x, y) => {                            // -> v = [Y, Cb, Cr, D]
    x -= 0.5; y -= 0.5;                                   // pixel centres sit at +0.5
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    const i00 = (y0 * W + x0) * 4, i01 = i00 + 4, i10 = i00 + W * 4, i11 = i10 + 4;
    const w00 = (1 - fx) * (1 - fy), w01 = fx * (1 - fy), w10 = (1 - fx) * fy, w11 = fx * fy;
    const r = px[i00] * w00 + px[i01] * w01 + px[i10] * w10 + px[i11] * w11;
    const g = px[i00 + 1] * w00 + px[i01 + 1] * w01 + px[i10 + 1] * w10 + px[i11 + 1] * w11;
    const b = px[i00 + 2] * w00 + px[i01 + 2] * w01 + px[i10 + 2] * w10 + px[i11 + 2] * w11;
    const l = 0.299 * r + 0.587 * g + 0.114 * b;
    v[0] = l; v[1] = 128 + 0.564 * (b - l); v[2] = 128 + 0.713 * (r - l);
    v[3] = paperDist(l, v[1], v[2], ref);
  };
  let cap = 0, pY, pCb, pCr, pD;
  // edge strength for integer offsets s0..s1 along the normal (nx,ny) from
  // (cx,cy): the larger of the signed paper-distance increase and 0.8 x the
  // sign-free colour change, both over 2 px. NaN outside the image.
  const strengths = (cx, cy, nx, ny, s0, s1) => {
    const M = s1 - s0 + 3;
    if (M > cap) { cap = M; pY = new Float32Array(M); pCb = new Float32Array(M); pCr = new Float32Array(M); pD = new Float32Array(M); }
    for (let s = s0 - 1, k = 0; s <= s1 + 1; s++, k++) {
      const x = cx + nx * s, y = cy + ny * s;
      if (x < 1 || y < 1 || x > W - 2 || y > H - 2) { pY[k] = NaN; continue; }
      sample(x, y); pY[k] = v[0]; pCb[k] = v[1]; pCr[k] = v[2]; pD[k] = v[3];
    }
    const out = new Float32Array(s1 - s0 + 1);
    for (let k = 1; k <= s1 - s0 + 1; k++) {
      if (pY[k - 1] !== pY[k - 1] || pY[k + 1] !== pY[k + 1]) { out[k - 1] = NaN; continue; }
      out[k - 1] = Math.max(pD[k + 1] - pD[k - 1],
        0.8 * colourStep(pY[k + 1] - pY[k - 1], pCb[k + 1] - pCb[k - 1], pCr[k + 1] - pCr[k - 1]));
    }
    return out;
  };
  const dist = (x, y) => {                              // paper distance at (x,y), NaN outside
    if (x < 1 || y < 1 || x > W - 2 || y > H - 2) return NaN;
    sample(x, y); return v[3];
  };
  return { sample, strengths, dist };
}

// Candidate page-edge lines near a rough edge A->B. Every sample along the
// inner 84% of the edge contributes all its edge-response peaks within
// [-rangeIn, rangeOut] px of the rough line (negative = inward). Lines within
// 12 deg of the rough edge are found with a (slope, offset) Hough vote that
// counts distinct samples; a line needs support from `need` of the in-frame
// samples. Candidates (up to 8, at least 3 px apart) come ordered by support
// ('support') or from the outermost inward ('outer'), each with the median
// paper distance 4..14 px inside and outside it, and across the strip between
// it and the rough edge where it lies inward of that edge.
function findEdgeLine(sampler, A, B, ux, uy, nx, ny, len, K, rangeIn, rangeOut, minG, need, order) {
  const pts = [];
  let valid = 0;
  for (let k = 0; k < K; k++) {
    const t = 0.08 + 0.84 * (k + 0.5) / K;
    const cx = A.x + ux * t * len, cy = A.y + uy * t * len;
    const g = sampler.strengths(cx, cy, nx, ny, -rangeIn, rangeOut);
    let any = false;
    for (let j = 1; j < g.length - 1; j++) {
      if (g[j] !== g[j]) continue;
      any = true;
      if (g[j] < minG || g[j] < g[j - 1] || g[j] <= g[j + 1]) continue;
      let off = 0;                                        // sub-pixel peak position
      const g0 = g[j - 1], g2 = g[j + 1], den = g0 - 2 * g[j] + g2;
      if (den < 0 && g0 === g0 && g2 === g2) off = Math.max(-1, Math.min(1, 0.5 * (g0 - g2) / den));
      const sp = j - rangeIn + off;
      pts.push({ k, d: (t - 0.5) * len, s: sp, g: g[j], x: cx + nx * sp, y: cy + ny * sp });
    }
    if (any) valid++;
  }
  const res = { ok: false, valid, cands: [] };
  const needN = need * valid;
  if (valid < 0.3 * K || pts.length < needN) return res;

  // Hough: s = c + m * d, slope bins fine enough for <= 2 px drift over the edge
  // tolerance grows with edge length: real paper edges curl a little
  const tol = Math.max(1.5, len / 800);
  const mStep = 2 * tol / len, half = Math.max(1, Math.round(Math.tan(8 * Math.PI / 180) / mStep));
  const nM = 2 * half + 1, c0 = Math.round(-rangeIn / tol) - 1, nC = Math.round((rangeIn + rangeOut) / tol) + 3;
  const acc = new Uint16Array(nM * nC), lastK = new Int16Array(nM * nC).fill(-1);
  for (const p of pts) for (let jm = 0; jm < nM; jm++) {
    const c = Math.round((p.s - (jm - half) * mStep * p.d) / tol) - c0;
    if (c < 0 || c >= nC) continue;
    const idx = jm * nC + c;
    if (lastK[idx] !== p.k) { lastK[idx] = p.k; acc[idx]++; }
  }
  const votes = (jm, c) => (c > 0 ? acc[jm * nC + c - 1] : 0) + acc[jm * nC + c] + (c < nC - 1 ? acc[jm * nC + c + 1] : 0);
  const bins = [];
  for (let c = 0; c < nC; c++) for (let jm = 0; jm < nM; jm++) { const v = votes(jm, c); if (v >= needN) bins.push({ c, jm, v }); }
  if (!bins.length) return res;
  bins.sort(order === 'outer' ? (a, b) => (b.c - a.c) || (b.v - a.v) : (a, b) => (b.v - a.v) || (b.c - a.c));

  const med = arr => { arr.sort((x, y) => x - y); return arr.length ? arr[arr.length >> 1] : NaN; };
  const low2 = arr => { arr.sort((x, y) => x - y); return arr.length > 1 ? arr[1] : arr.length ? arr[0] : NaN; };  // second lowest
  const maxCands = order === 'outer' ? 40 : 12;
  for (const bin of bins) {
    if (res.cands.length >= maxCands) break;
    // the bin only locates the line to within its quantisation; refit s = c + m d
    // on the inliers (twice, tightening the tolerance) before counting support
    let m = (bin.jm - half) * mStep, cOff = (bin.c + c0) * tol, inl = null;
    for (const tt of [1.5 * tol, tol, tol]) {
      inl = new Map();                                    // one inlier per sample: smallest residual
      for (const p of pts) {
        const r = Math.abs(p.s - (cOff + m * p.d));
        if (r <= tt && (!inl.has(p.k) || r < inl.get(p.k).r)) inl.set(p.k, { p, r });
      }
      if (inl.size < needN) break;
      let sd = 0, ss = 0, sdd = 0, sds = 0, n = inl.size;
      for (const e of inl.values()) { sd += e.p.d; ss += e.p.s; sdd += e.p.d * e.p.d; sds += e.p.d * e.p.s; }
      const md = sd / n, ms = ss / n, varD = sdd / n - md * md;
      m = varD > 1e-6 ? (sds / n - md * ms) / varD : 0;
      cOff = ms - m * md;
    }
    if (inl.size < needN) continue;
    if (res.cands.some(x => Math.abs(x.cOff - cOff) <= 2 * tol && Math.abs(x.m - m) * len / 2 <= 2 * tol)) continue;  // same line
    const inliers = [...inl.values()].map(e => e.p);
    let sSum = 0, r2 = 0; for (const e of inl.values()) { sSum += e.p.s; r2 += e.r * e.r; }
    // paper distance just inside / just outside the line, across the strip
    // from the line up to the rough edge where the line lies inward of it,
    // and across the strip from the rough edge out to the line where it lies outward
    // Per-sample probes: paper reading 4..14 px inside the line, 4..14 px
    // outside it, and across the strip between the line and the rough edge.
    // Each sample is judged against its own inside reading.
    const inner = [], outer = [], okPaper = new Array(K), okStrip = new Array(K), insideK = new Array(K);
    let nPaper = 0, nSide = 0, nStripIn = 0, nStripInNonPaper = 0, nStripOut = 0, nStripOutPaper = 0;
    for (let k = 0; k < K; k++) {
      const t = 0.08 + 0.84 * (k + 0.5) / K;
      const cx = A.x + ux * t * len, cy = A.y + uy * t * len, ck = cOff + m * (t - 0.5) * len;
      const mi = [], mo = [], ms = [];
      for (let j = 0; j < 5; j++) {
        const q = (j + 0.5) / 5;
        const si = ck - 4 - 10 * q, so = ck + 4 + 10 * q;

    const e=[0,1,2,3].map(i=>Math.hypot(d[(i+s)%4].x-gt[i].x, d[(i+s)%4].y-gt[i].y));
    const m=Math.max(...e);
    if(!best||m<best.max) best={max:m, mean:e.reduce((a,b)=>a+b)/4, shift:s, e};
  }
  return best;
}

const cases=[

const lines=[]; const thumbs=document.getElementById('thumbs');
for(const c of cases){
  const gt = c.q ? gtQuad(c.W,c.H,c.q) : null;
  const cv = scene({...c, quad:gt});
  const t0=performance.now(); const det=detectPageQuad(cv,{minAreaFrac:0.25}); const ms=(performance.now()-t0).toFixed(0);
  const e=err(det,gt);
  let line;
  if(!gt) line = `${c.name}: ${det?'FALSE POSITIVE':'null (correct)'} ${ms}ms`;
  else if(!det) line = `${c.name}: MISSED ${ms}ms`;
  else line = `${c.name}: max ${e.max.toFixed(2)}px mean ${e.mean.toFixed(2)}px shift ${e.shift} [${e.e.map(v=>v.toFixed(1)).join(', ')}] ${ms}ms`;
  lines.push(line);
  const g=cv.getContext('2d'); g.lineWidth=Math.max(2,c.W/400);
  if(gt){ g.strokeStyle='lime'; path(g,gt); g.stroke(); }
  if(det){ g.strokeStyle='red'; path(g,[det.tl,det.tr,det.br,det.bl]); g.stroke(); g.fillStyle='red'; g.beginPath(); g.arc(det.tl.x,det.tl.y,c.W/80,0,7); g.fill(); }
  cv.className='t'; thumbs.appendChild(cv);
}
document.getElementById('out').textContent=lines.join('\n');
